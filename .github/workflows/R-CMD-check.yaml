# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples

name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'oldrel-1'}
          - {os: macos-latest, r: 'release'}
          - {os: macos-latest, r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      # The check does not need the BLUPF90+ backend (binary-dependent tests
      # skip without it); do not download it at install time.
      BREEDR_SKIP_INSTALL_BINARIES: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          # macOS stays off RSPM: RSPM/P3M's arm64 binary of dotCall64 (used by
          # spam) needs an OpenMP symbol the runner's libomp does not provide,
          # so dyn.load() fails; CRAN's own macOS binaries load fine.
          use-public-rspm: ${{ matrix.config.os != 'macos-latest' }}

      # INLA is optional — install from its own repo, but don't fail if unavailable
      - name: Install INLA (optional)
        shell: Rscript {0}
        run: |
          tryCatch(
            install.packages(
              "INLA",
              repos = c(
                INLA = "https://inla.r-inla-download.org/R/testing",
                CRAN = "https://cloud.r-project.org"
              )
            ),
            error = function(e) message("INLA install failed (optional): ", e$message)
          )

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # No PROGSF90 binaries are installed here: inst/bin is .Rbuildignore'd, so
      # the checked tarball never contains them, and the unit tests skip the
      # binary-dependent cases when the backend is absent. The integration job
      # (below) installs the binaries via the package's own installers.
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-vignettes","--no-build-vignettes","--no-manual")'
          build_args: 'c("--no-build-vignettes")'
          error-on: '"error"'
          upload-snapshots: true
        env:
          _R_CHECK_CRAN_INCOMING_: false

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.os }}-r${{ matrix.config.r }}-results
          path: check

  integration-tests:
    runs-on: ubuntu-latest
    name: Integration tests (ubuntu-latest, release)
    needs: R-CMD-check
    # Best effort: this job downloads and runs the BLUPF90 backend, an external
    # dependency that is occasionally unreachable or platform-incompatible on
    # the runners. Do not fail the whole workflow when the backend is not
    # available; the R CMD check matrix above is the required gate.
    continue-on-error: true

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      # The UGA server is slow: R's default 60 s cuts binaries off part way.
      # Set through the environment so R CMD INSTALL's download sees it too.
      R_DEFAULT_INTERNET_TIMEOUT: 600

    steps:
      - uses: actions/checkout@v4

      # nce.ads.uga.edu sends its certificate without the intermediate that
      # signed it. Windows fetches the intermediate itself; OpenSSL doesn't, so
      # every download fails here (#57). Add the issuer the certificate names,
      # after checking that it chains to a root the runner already trusts.
      # Does nothing once the server sends the full chain.
      - name: Trust the UGA server's intermediate certificate
        run: |
          host=nce.ads.uga.edu
          if curl -fsS -o /dev/null "https://$host/"; then
            echo "The chain already verifies."
            exit 0
          fi
          d=$(mktemp -d)
          openssl s_client -connect "$host:443" -servername "$host" </dev/null 2>/dev/null |
            openssl x509 -out "$d/server.pem"
          url=$(openssl x509 -in "$d/server.pem" -noout -ext authorityInfoAccess |
            sed -n 's/^ *CA Issuers - URI:\(.*\)$/\1/p' | head -n 1)
          echo "Issuer: $url"
          curl -fsSL "$url" -o "$d/issuer.der"
          openssl x509 -inform DER -in "$d/issuer.der" -out "$d/issuer.pem"
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt "$d/issuer.pem"
          sudo cp "$d/issuer.pem" /usr/local/share/ca-certificates/uga-issuer.crt
          sudo update-ca-certificates
          curl -fsS -o /dev/null "https://$host/"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install INLA (optional)
        shell: Rscript {0}
        run: |
          tryCatch(
            install.packages(
              "INLA",
              repos = c(
                INLA = "https://inla.r-inla-download.org/R/testing",
                CRAN = "https://cloud.r-project.org"
              )
            ),
            error = function(e) message("INLA install failed (optional): ", e$message)
          )

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::spam

      - name: Install breedR from source
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source", INSTALL_opts = "--no-multiarch")

      - name: Install BLUPF90 binaries (base + genomic + renumf90)
        shell: Rscript {0}
        run: |
          # Print download warnings as they happen: they carry the cause.
          options(warn = 1)
          checks <- function() c(
            base     = isTRUE(breedR::check_progsf90(quiet = TRUE)),
            genomic  = isTRUE(breedR::check_genomic_programs(quiet = TRUE)),
            renumf90 = isTRUE(breedR::check_renumf90(quiet = TRUE))
          )
          # Retry: downloads from UGA are slow and sometimes time out.
          for (attempt in 1:3) {
            breedR::install_progsf90(quiet = TRUE)
            breedR::install_genomic_programs(quiet = TRUE)
            breedR::install_renumf90(quiet = TRUE)
            if (all(checks())) break
            message("Binary install attempt ", attempt, " incomplete; retrying...")
            Sys.sleep(15)
          }
          print(list.files(system.file("bin", package = "breedR")))
          ok <- checks()
          if (!all(ok))
            stop("BLUPF90 binaries could not be downloaded: ",
                 paste(names(ok)[!ok], collapse = ", "))

      # The binaries need the MKL and Intel OpenMP libraries; UGA's Readme asks
      # users to install them. Take them from Intel's PyPI wheels. Keep every
      # library: MKL loads its CPU-specific ones at runtime.
      - name: Install the MKL runtime the binaries need
        run: |
          python3 -m pip download --no-deps --only-binary=:all: \
            --dest "$RUNNER_TEMP/wheels" mkl==2024.2.2 intel-openmp==2024.2.1
          mkdir -p "$RUNNER_TEMP/mkl"
          for whl in "$RUNNER_TEMP"/wheels/*.whl; do
            unzip -q -j -o "$whl" '*.data/data/lib/*' -d "$RUNNER_TEMP/mkl"
          done
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/mkl${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      # Run in the package namespace: the tests call unexported functions
      # (#15). Failures already filed are listed below; anything else fails
      # the job, and so does a listed test that now passes.
      - name: Run integration tests
        shell: Rscript {0}
        run: |
          library(testthat)
          res <- as.data.frame(test_dir(
            "tests/integration", reporter = "summary", stop_on_failure = FALSE,
            package = "breedR", load_package = "installed"
          ))

          # The fix for each of these removes its entry.
          known <- c(
            "test-binaries.R / Installation of binaries and checking runs smoothly" = "#28",
            "test-reml-interface.R / Simulated values reasonably recovered using one or more traits" = "#29"
          )
          key <- paste(res$file, "/", ifelse(is.na(res$test), "(top level)", res$test))
          failing <- unique(key[res$failed > 0 | res$error])
          for (k in intersect(failing, names(known)))
            message("Known failure (", known[[k]], "): ", k)

          new <- setdiff(failing, names(known))
          fixed <- setdiff(names(known), failing)
          if (length(new))
            message("New failures: ", paste(new, collapse = "; "))
          if (length(fixed))
            message("Now passing, remove from the known list: ", paste(fixed, collapse = "; "))
          if (length(new) || length(fixed))
            stop("Integration results differ from the known failures.")

      - name: Upload integration test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            tests/integration/*.Rout
            tests/integration/*.Rout.fail
