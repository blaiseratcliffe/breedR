# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples

name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'oldrel-1'}
          - {os: macos-latest, r: 'release'}
          - {os: macos-latest, r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      # The check does not need the BLUPF90+ backend (binary-dependent tests
      # skip without it); do not download it at install time.
      BREEDR_SKIP_INSTALL_BINARIES: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # INLA is optional — install from its own repo, but don't fail if unavailable
      - name: Install INLA (optional)
        shell: Rscript {0}
        run: |
          tryCatch(
            install.packages(
              "INLA",
              repos = c(
                INLA = "https://inla.r-inla-download.org/R/testing",
                CRAN = "https://cloud.r-project.org"
              )
            ),
            error = function(e) message("INLA install failed (optional): ", e$message)
          )

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # No PROGSF90 binaries are installed here: inst/bin is .Rbuildignore'd, so
      # the checked tarball never contains them, and the unit tests skip the
      # binary-dependent cases when the backend is absent. The integration job
      # (below) installs the binaries via the package's own installers.
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-vignettes","--no-build-vignettes","--no-manual")'
          build_args: 'c("--no-build-vignettes")'
          error-on: '"error"'
          upload-snapshots: true
        env:
          _R_CHECK_CRAN_INCOMING_: false

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.os }}-r${{ matrix.config.r }}-results
          path: check

  integration-tests:
    runs-on: ubuntu-latest
    name: Integration tests (ubuntu-latest, release)
    needs: R-CMD-check
    # Best effort: this job downloads and runs the BLUPF90 backend, an external
    # dependency that is occasionally unreachable or platform-incompatible on
    # the runners. Do not fail the whole workflow when the backend is not
    # available; the R CMD check matrix above is the required gate.
    continue-on-error: true

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install INLA (optional)
        shell: Rscript {0}
        run: |
          tryCatch(
            install.packages(
              "INLA",
              repos = c(
                INLA = "https://inla.r-inla-download.org/R/testing",
                CRAN = "https://cloud.r-project.org"
              )
            ),
            error = function(e) message("INLA install failed (optional): ", e$message)
          )

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::spam

      - name: Install breedR from source
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source", INSTALL_opts = "--no-multiarch")

      - name: Install BLUPF90 binaries (base + genomic + renumf90)
        shell: Rscript {0}
        run: |
          # Retry: the UGA download is occasionally unreachable from runners.
          for (attempt in 1:3) {
            suppressWarnings({
              breedR::install_progsf90(quiet = TRUE)
              breedR::install_genomic_programs(quiet = TRUE)
              breedR::install_renumf90(quiet = TRUE)
            })
            if (isTRUE(breedR::check_progsf90(quiet = TRUE))) break
            message("Binary install attempt ", attempt, " incomplete; retrying...")
            Sys.sleep(15)
          }
          print(list.files(system.file("bin", package = "breedR")))
          if (!isTRUE(breedR::check_progsf90(quiet = TRUE)))
            stop("BLUPF90 backend could not be downloaded.")

      - name: Run integration tests
        shell: Rscript {0}
        run: |
          library(testthat)
          library(breedR)
          test_dir("tests/integration", reporter = "summary", stop_on_failure = TRUE)

      - name: Upload integration test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            tests/integration/*.Rout
            tests/integration/*.Rout.fail
